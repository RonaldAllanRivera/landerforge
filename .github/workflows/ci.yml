name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push supersedes an in-flight run on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, lint, test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        # Version comes from packageManager in package.json.

      - uses: actions/setup-node@v5
        with:
          node-version-file: package.json
          cache: pnpm

      # --frozen-lockfile fails rather than silently resolving a drifted lockfile.
      - run: pnpm install --frozen-lockfile

      - run: pnpm run typecheck
      - run: pnpm run lint
      - run: pnpm run test

  build:
    name: Production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: package.json
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Build-time env only needs to be well-formed: pages are dynamic, so nothing
      # here reaches a real service.
      - run: pnpm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_placeholder
          SUPABASE_SECRET_KEY: sb_secret_placeholder

  database:
    name: RLS policy tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: supabase/setup-cli@v1
        with:
          # Pinned, not `latest`. Supabase's default grants for `authenticated`
          # changed between CLI versions, which made these tests pass locally and
          # fail in CI. Migration 0005 no longer depends on that default, but an
          # unpinned toolchain is still an untracked input to the test result.
          version: 2.115.0

      # Applies every migration, so the hooks, triggers and policies under test are
      # exactly the ones the app ships.
      - run: supabase db start
      - run: supabase test db

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          # Proves the multi-stage build resolves without publishing anything.
          cache-from: type=gha
          cache-to: type=gha,mode=max
